<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terraproject5</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            background-color: mediumturquoise;
        }
        h1 {
            font-size: 42px;
        }
        ul {
            list-style-position: inside;
        }
        a {
            text-decoration: none;
            color: black;
            font-size: 32px;
            margin: 10px;
        }
        li {
            background-color: brown;
            color: white;
            font-weight: bold;
            border-radius: 20px;
            padding: 10px 0;
            transition: all 0.3s;
        }
        li:hover {
            font-size: 42px;
            margin: 0;
        }
        .stickman1 {
            rotate: 80deg;
            font-weight: bold;
            font-size: 100px;
            position: fixed;
            right: 0;
            bottom: 0;
            transition: 10s all;
        }
        .stickman1:hover {
            rotate:123456deg;
        }
        .stickman2 {
            rotate: 100deg;
            font-size: 50px;
            font-weight:bold;
            position: fixed;
            left: 0;
            bottom: 0;
            transition: 1s all;
        }
        .stickman2:hover {
            rotate: -90deg;
            transform: scale(3);
        }
        .dogy {
            font-size: 40px;
            position: fixed;
            bottom: 0;
            left: calc((100% / 2) - 20px);
            font-weight: bold;
            transition: 1s all;
        }
        .dogy:hover {
            opacity: 0;
        }
    </style>
</head>
<body>
    <h1>Terraproject5</h1>
    <p>Üdvözölöm a Terraproject5-ben.</p>
    <ul>
        <a href="/tanulasrogzites/dist/index.html">
            <li>Nézzük meg (tesztelés)</li>
        </a>
        <a href="https://github.com/JaniGITJANIKA/terraproject5">
            <li>Nézzük meg a Respositoryt.</li>
        </a>
        <p class="stickman1">:)-K</p>
        <p class="stickman2">q:>-|o<</p>
        <p class="dogy">o\-m</p>
    </ul>
</body>
</html>
